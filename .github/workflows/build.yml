name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight build pointless. Tags are left
  # alone, since those builds are the ones that become release artifacts.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The toolchain needs a real JDK: AGP rejects a JRE with "does not provide the
      # required capabilities: [JAVA_COMPILER]", which is the failure to expect if this
      # is ever changed to a headless runtime.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 is newer than what the runner image ships, so the platform and
      # build-tools are installed explicitly rather than relied on. Note the platform
      # package is "android-37.0", not "android-37".
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=TimeBank-${version}-${GITHUB_SHA::7}-debug" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
